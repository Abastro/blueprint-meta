# Builds every document listed in docs/documents.json with `make dist` and
# attaches the PDFs to the rolling `pdf` release, so each one has a stable
# download link:
#   https://github.com/<owner>/<repo>/releases/download/pdf/<name>.pdf
name: Build PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to move the `pdf` tag and update its release

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every `run` step below runs inside this TeX Live image (Debian-based).
    container: texlive/texlive:latest
    steps:
      - name: Install make and python3 if missing
        run: |
          for tool in make python3; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            apt-get update && apt-get install -y --no-install-recommends $missing
          fi

      - uses: actions/checkout@v4

      # The same entry point as locally. -k keeps going to report every
      # broken document; dist/ only gets filled if all of them build.
      - name: Build
        run: make -k -j "$(nproc)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/
          if-no-files-found: error

  # On the plain runner, which has git, gh, jq and python3.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: dist

      # Updates the release in place instead of deleting and recreating it, so
      # the download links never disappear, even if this run gets cancelled.
      - name: Publish to the `pdf` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/pdf"
          notes=$(make --silent --no-print-directory json | jq -r --arg base "$base" --arg sha "$GITHUB_SHA" '
            "Built from \($sha).\n\n"
            + (map("- [\(.title)](\($base)/\(.name).pdf)") | join("\n"))
          ')

          git tag -f pdf "$GITHUB_SHA"
          git push -f origin refs/tags/pdf
          if gh release view pdf > /dev/null 2>&1; then
            gh release upload pdf dist/*.pdf --clobber
            gh release edit pdf --notes "$notes"
          else
            gh release create pdf dist/*.pdf --title "Latest PDFs" --notes "$notes"
          fi

          # Drop PDFs of documents no longer in the manifest.
          gh release view pdf --json assets -q '.assets[].name' | while IFS= read -r asset; do
            [ -f "dist/$asset" ] || gh release delete-asset pdf "$asset" --yes
          done
